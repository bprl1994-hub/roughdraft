<style>
:root{--green:#15803d;--ink:#0f172a;--muted:#475569;--line:#e2e8f0;--bg:#f8fafc;--card:#ffffff}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--green);color:#fff;padding:20px 16px}
header a{color:#fff;text-decoration:none;font-weight:700;font-size:18px}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 20px 8px;margin:16px 0}
h1{font-size:28px;line-height:1.25;margin:8px 0 4px}
h2{font-size:18px;margin:28px 0 8px}
.card h2:first-child{margin-top:0}
p,li{color:var(--ink)}
.meta{color:var(--muted);font-size:14px}
a{color:var(--green)}
ol li{margin-bottom:6px}
nav.links a{display:block;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
footer{max-width:720px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:14px}
</style>
